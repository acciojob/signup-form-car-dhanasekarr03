<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" placeholder="Name" required>

		<label for="email">Email</label>
		<input type="email" id="email" placeholder="Email">

		<label for="gender">Gender</label>
		<input type="radio" id="gender_m" name="gender" required>
		
		<label for="gender">Gender</label>
		<input type="radio" id="gender_f" name="gender" required>

		<label for="cars">Car Brands</label>
		<select id="cars" placeholder="--Please choose an option--" required>
			<option>Audi</option>
			<option>BMW</option>
			<option>Kia</option>
			<option>Honda</option>
		</select>
		
		<label for="number">Age</label>
		<input type="number" id="age" placeholder="Age" required>

		<label for="dob">DOB</label>
		<input type="date" id="dob" required>

		<label for="tel">Phone Number</label>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
		
		<label for="password">Password</label>
		<input type="password" id="password" placeholder="Password" required>

		<label for="tos">I agree to the TOS</label>
		<input type="checkbox" id="tos" required>


		
		<input type="submit" value="Submit">
	</form>
	<!-- the entire body must be written by student -->

</script>

</html>
